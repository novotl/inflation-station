# Where fetch-prices downloads the daily closes of exchange-traded funds: ISIN = its ticker on Yahoo Finance.
#
# A fund is listed on several exchanges, often in different currencies (e.g. SXR7.DE on Xetra in EUR, CSPX.L on the
# LSE in USD). Pick the listing in the currency you bought it in, as the export shows it (Portu's `Cena`, in `Měna`):
# open https://finance.yahoo.com/quote/<ticker>, check the fund's name and that "Currency in" matches. A fund must be
# in this file or in conseq_funds.toml, not both.


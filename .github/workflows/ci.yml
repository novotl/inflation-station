name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage comment
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # diff-cover diffs against origin/main

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache pre-commit environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Tests
        if: github.event_name != 'pull_request'
        run: make test

      - name: Tests and diff coverage
        id: cov
        if: github.event_name == 'pull_request'
        run: make cov

      - name: Coverage comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.cov.outcome }}
        run: |
          if [[ $OUTCOME == skipped ]]; then
            body="**Diff coverage** not run: an earlier step failed. See the CI log."
          elif [[ ! -f diff-cover.md ]]; then
            body="**Diff coverage** not computed: \`make cov\` failed before diff-cover wrote its report. See the CI log."
          elif [[ $OUTCOME == success ]]; then
            body="**Diff coverage**: all changed lines covered."
          else
            body="$(cat diff-cover.md)"
          fi
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"

      - name: Build
        run: make build
